<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodieCare - Recommender Legacy</title>
  <link rel="stylesheet" href="/assets/app.css?v=20260223c" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <button class="secondary" id="back-main">Back Main</button>
      <button class="secondary" id="logout">Logout</button>
    </div>

    <header class="hero">
      <h1>Recommender (Legacy)</h1>
      <p class="sub">This page is replaced by V2 single-flow experience on main page.</p>
    </header>

    <section class="card">
      <h2>Moved To V2</h2>
      <p class="sub">Location, preferences, list/swipe results are now integrated in one page.</p>
      <div class="actions">
        <button id="open-v2">Open V2 Flow</button>
      </div>
      <p id="msg" class="notice"></p>
    </section>
  </div>

  <script src="/assets/app.js?v=20260223c"></script>
  <script>
    const auth = FC.requireAuth('/index.html');
    if (!auth) throw new Error('Unauthorized');

    const q = FC.parseQuery();
    const msg = document.getElementById('msg');

    function goV2() {
      const params = new URLSearchParams();
      if (Number.isFinite(q.lat) && Number.isFinite(q.lng)) {
        params.set('lat', String(q.lat));
        params.set('lng', String(q.lng));
      }
      const suffix = params.toString() ? `?${params.toString()}` : '';
      location.href = `/main.html${suffix}`;
    }

    document.getElementById('open-v2').addEventListener('click', goV2);
    document.getElementById('back-main').addEventListener('click', goV2);
    document.getElementById('logout').addEventListener('click', () => {
      FC.clearAuth();
      location.href = '/index.html';
    });

    FC.text(msg, 'Redirecting to V2 in 2 seconds...', 'ok');
    setTimeout(goV2, 2000);
  </script>
</body>
</html>
